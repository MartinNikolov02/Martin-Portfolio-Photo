{{ define "main" }}
<div class="mx-auto w-full max-w-4xl px-4 py-6">
  <a href="{{ "/" | relURL }}" class="text-sm underline">← back to home</a>
  <h1 class="text-3xl font-bold mt-2 mb-6">{{ .Title }}</h1>

  {{ $p := .Params }}
  {{ range $p.clips }}
    {{ $file := .file }}
    {{ $res := $.Resources.Get $file }}
    <div class="mb-8">
      <h2 class="text-lg font-semibold mb-2">{{ .title }}</h2>
      {{ with $res }}
        <div class="rounded-lg border border-white overflow-hidden">
          <video controls style="width: 100%; display: block;" preload="metadata">
            <source src="{{ .RelPermalink }}">
            Your browser doesn't support embedded video.
          </video>
        </div>
      {{ end }}
    </div>
  {{ end }}

  {{ .Content }}
</div>
{{ end }}
