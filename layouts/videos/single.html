{{ define "main" }}
<div class="mx-auto w-full max-w-5xl px-4 py-6">
  <a href="{{ "/" | relURL }}" class="text-sm underline">← back to home</a>
  <h1 class="text-3xl font-bold mt-2 mb-6">{{ .Title }}</h1>

  {{ $p := .Params }}
  <div class="video-grid">
    {{ range $p.clips }}
      {{ $file := .file }}
      {{ $title := .title }}
      {{ $res := $.Resources.Get $file }}
      {{ with $res }}
      <div class="video-grid-item">
        <video controls style="width: 100%; height: 100%; display: block; object-fit: cover;" preload="metadata">
          <source src="{{ .RelPermalink }}">
          Your browser doesn't support embedded video.
        </video>
        <div class="video-grid-caption">{{ $title }}</div>
      </div>
      {{ end }}
    {{ end }}
  </div>

  {{ .Content }}
</div>

<style>
  .video-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
    margin-top: 1rem;
  }
  @media (min-width: 640px) {
    .video-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }
  .video-grid-item {
    display: flex;
    flex-direction: column;
    border: 1px solid white;
    border-radius: 0.5rem;
    overflow: hidden;
  }
  .video-grid-item video {
    height: 220px;
    background: black;
  }
  .video-grid-caption {
    padding: 0.4rem 0.6rem;
    font-size: 0.75rem;
  }
</style>
{{ end }}
